# issue #363（kamonabe、不具合の報告。§8 の仕分けで「受け入れ」）から作った fix。scheduler の handle 経路の cancellation token が
# execution ごとに作られず ExecutionContext の評価器の 1 つの token を使い回すため、非 terminal の handle を drop しただけで
# （Drop が token を cancel する）その context の以後の execution がすべて Cancelled になり、前の execution の token を後から cancel
