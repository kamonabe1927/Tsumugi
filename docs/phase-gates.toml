# Phase の完了 gate の一覧（verification-release-operations §19）。
#
# ロードマップのマイルストーン表の「完了 gate」列を受入 ID に開き、各 ID を満たすテストを紐づける。
# 検査は tests/phase_gates_contract.rs（cargo test --test phase_gates_contract -- --nocapture で Phase ごとの数が見える）。
# 運用の規則は §19 と loop-runbook に置き、ここにはフィールドの定義だけを置く。数は観測で、目標値・閾値ではない。
#
# [[gate]]（受入 ID があるもの）
#   phase  = 整数 0〜7。必須。
#   id     = 文字列。必須。spec にある受入 ID そのまま（部分は note に書く）。同じ phase と id の組は 1 行だけ。
#   source = { doc = "...", section = "..." }。必須。ID が書かれた見出し（完全一致）。id がその見出しの節の本文に現れること。
#   tests  = ["<tests/ か src/ の下の .rs>::<関数名>", ...]。必須。満たすテスト。まだ無ければ []。
#   open   = ["<スライス id>", ...]。任意。満たすのにまだ要るスライス（slices.toml にあり、done でない）。
#   note   = 文字列。任意。
#
# [[unnumbered]]（受入 ID が未採番の条件。全数に入れず別に数える）
#   phase・source・note の 3 つ（すべて必須）。id・tests・open は持たない。note に条件の中身を書く。
#
# 満たした = tests が空でなく open が空。tests があっても open があるもの、tests が空のものは残りに数える。

